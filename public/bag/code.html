<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary": "#ffffff", "outline": "#747878", "surface-tint": "#5f5e5e", "primary": "#000000", "error": "#ba1a1a", "inverse-surface": "#2f312f", "on-tertiary": "#ffffff", "tertiary-container": "#291800", "inverse-primary": "#c8c6c5", "secondary-fixed-dim": "#e0c298", "on-surface-variant": "#444748", "surface": "#faf9f6", "on-error-container": "#93000a", "surface-container": "#efeeeb", "on-tertiary-fixed-variant": "#5e4114", "tertiary": "#000000", "secondary-container": "#fedeb2", "primary-fixed-dim": "#c8c6c5", "surface-container-low": "#f4f3f1", "on-secondary-fixed-variant": "#584323", "surface-variant": "#e3e2e0", "on-secondary-container": "#78603e", "surface-container-highest": "#e3e2e0", "on-error": "#ffffff", "primary-fixed": "#e5e2e1", "on-primary-fixed": "#1c1b1b", "error-container": "#ffdad6", "secondary-fixed": "#fedeb2", "on-primary-fixed-variant": "#474646", "surface-bright": "#faf9f6", "surface-container-lowest": "#ffffff", "on-tertiary-container": "#a17e4b", "on-tertiary-fixed": "#291800", "tertiary-fixed": "#ffddb2", "on-secondary-fixed": "#281800", "secondary": "#725b38", "outline-variant": "#c4c7c7", "surface-container-high": "#e9e8e5", "on-primary-container": "#858383", "on-secondary": "#ffffff", "background": "#faf9f6", "primary-container": "#1c1b1b", "tertiary-fixed-dim": "#e9c087", "surface-dim": "#dbdad7", "on-surface": "#1a1c1a", "on-background": "#1a1c1a", "inverse-on-surface": "#f2f1ee" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1.5rem", "gutter-mobile": "1rem", "space-xl": "3rem", "margin-mobile": "1.25rem", "space-md": "1rem", "space-sm": "0.5rem", "margin": "4rem", "space-xs": "0.25rem", "space-lg": "1.75rem" }, "fontFamily": { "label-md": [ "Plus Jakarta Sans" ], "label-sm": [ "Plus Jakarta Sans" ], "body-md": [ "Plus Jakarta Sans" ], "label-lg": [ "Plus Jakarta Sans" ], "headline-md": [ "Playfair Display" ], "headline-lg": [ "Playfair Display" ], "title-md": [ "Plus Jakarta Sans" ], "body-lg": [ "Plus Jakarta Sans" ], "display": [ "Playfair Display" ], "headline-lg-mobile": [ "Playfair Display" ], "body-sm": [ "Plus Jakarta Sans" ], "title-lg": [ "Plus Jakarta Sans" ], "display-mobile": [ "Playfair Display" ], "headline-sm": [ "Playfair Display" ] }, "fontSize": { "label-md": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.16em", "fontWeight": "500" } ], "label-sm": [ "10px", { "lineHeight": "12px", "letterSpacing": "0.2em", "fontWeight": "600" } ], "body-md": [ "15px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400" } ], "label-lg": [ "12px", { "lineHeight": "16px", "letterSpacing": "0.14em", "fontWeight": "600" } ], "headline-md": [ "32px", { "lineHeight": "40px", "letterSpacing": "0em", "fontWeight": "400" } ], "headline-lg": [ "48px", { "lineHeight": "56px", "letterSpacing": "-0.015em", "fontWeight": "400" } ], "title-md": [ "16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" } ], "body-lg": [ "18px", { "lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "400" } ], "display": [ "72px", { "lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "400" } ], "headline-lg-mobile": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "body-sm": [ "13px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" } ], "title-lg": [ "20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "display-mobile": [ "44px", { "lineHeight": "50px", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "headline-sm": [ "24px", { "lineHeight": "32px", "letterSpacing": "0em", "fontWeight": "500" } ] } } } };</script><link href="../shared/atelier.css" rel="stylesheet"/><script defer src="../shared/atelier.js"></script><script defer src="../shared/store.js"></script><title>Your Bag · Atelier Market</title></head><body data-page="bag" class="bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/40"><div class="h-20 max-w-6xl mx-auto px-margin-mobile lg:px-margin flex items-center justify-between">
<a class="flex items-center gap-space-xs" href="../home_marketplace_discover/code.html"><span class="font-headline-sm text-headline-sm uppercase tracking-tight">ATELIER</span><span class="font-label-sm text-label-sm tracking-[0.25em] text-secondary font-medium ml-1">MARKET</span></a>
<a class="flex items-center gap-2 font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant hover:text-on-surface" href="../home_marketplace_discover/code.html"><span class="material-symbols-outlined text-[16px]">arrow_back</span>Continue Shopping</a>
</div></header>
<main class="max-w-6xl mx-auto px-margin-mobile lg:px-margin pt-32 pb-24">
<section>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary" id="greeting">Your Atelier</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mt-2 mb-8">Bag &amp; Wishlist</h1>
<div class="flex gap-2 mb-10" role="tablist">
<button class="tab px-5 py-2 rounded-full font-label-sm text-label-sm uppercase tracking-wider" data-tab="bag">Bag</button>
<button class="tab px-5 py-2 rounded-full font-label-sm text-label-sm uppercase tracking-wider" data-tab="wishlist">Wishlist</button>
<button class="tab px-5 py-2 rounded-full font-label-sm text-label-sm uppercase tracking-wider" data-tab="orders">My Orders</button>
</div>
</section>
<section class="panel" id="panel-bag">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
<div class="lg:col-span-8 flex flex-col gap-4" id="bag-items"></div>
<aside class="lg:col-span-4">
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-md lg:sticky lg:top-28">
<h2 class="font-headline-sm text-headline-sm mb-6">Order Summary</h2>
<div class="flex justify-between font-body-md mb-2"><span class="text-on-surface-variant">Subtotal</span><span id="sum-subtotal">$0</span></div>
<div class="flex justify-between font-body-md mb-6"><span class="text-on-surface-variant">Shipping</span><span>Complimentary</span></div>
<div class="flex justify-between font-title-lg text-title-lg border-t border-outline-variant/40 pt-4 mb-6"><span>Total</span><span id="sum-total">$0</span></div>
<form class="flex flex-col gap-3" id="checkout-form">
<input class="w-full bg-surface-container-low px-4 py-3 rounded font-body-md focus:outline-none focus:ring-1 focus:ring-primary" id="co-name" placeholder="Full name" required/>
<input class="w-full bg-surface-container-low px-4 py-3 rounded font-body-md focus:outline-none focus:ring-1 focus:ring-primary" id="co-email" placeholder="Email" required type="email"/>
<button class="mt-2 w-full py-4 bg-primary hover:bg-secondary text-on-primary font-label-md text-label-md uppercase tracking-[0.18em] rounded shadow-md transition-colors disabled:opacity-40" id="place-order" type="submit">Place Order</button>
<p class="font-label-sm text-[10px] uppercase tracking-widest text-outline text-center">Prototype checkout · no payment taken</p>
</form>
</div>
</aside>
</div>
</section>
<section class="panel hidden" id="panel-wishlist"><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="wishlist-grid"></div></section>
<section class="panel hidden" id="panel-orders"><div class="flex flex-col gap-4" id="orders-list"></div></section>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const S = window.AtelierStore;
  const user = S.user();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const empty = (text, cta = true) => `<div class="col-span-full text-center py-16 bg-surface-container-low rounded-xl"><p class="font-body-md text-on-surface-variant mb-4">${text}</p>${cta ? '<a href="../home_marketplace_discover/code.html#new-arrivals" class="font-label-sm text-label-sm uppercase tracking-widest underline underline-offset-4">Discover new arrivals</a>' : ''}</div>`;

  if (!user.guest) {
    document.getElementById('greeting').textContent = `Welcome, ${user.name}`;
    document.getElementById('co-name').value = user.name;
    document.getElementById('co-email').value = user.email || '';
  }

  // Tabs
  const tabs = document.querySelectorAll('.tab');
  function show(name) {
    tabs.forEach(t => {
      const on = t.dataset.tab === name;
      t.classList.toggle('bg-primary', on); t.classList.toggle('text-on-primary', on);
      t.classList.toggle('text-on-surface-variant', !on); t.classList.toggle('bg-surface-container-low', !on);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('hidden', p.id !== 'panel-' + name));
    ({ bag: loadBag, wishlist: loadWishlist, orders: loadOrders })[name]();
  }
  tabs.forEach(t => t.addEventListener('click', () => { history.replaceState(null, '', '#' + t.dataset.tab); show(t.dataset.tab); }));

  async function loadBag() {
    const cart = await S.api('/cart?user=' + encodeURIComponent(user.id));
    const box = document.getElementById('bag-items');
    box.innerHTML = cart.items.length ? cart.items.map(it => `
      <div class="flex gap-5 bg-surface-container-lowest rounded-xl p-4 shadow-sm">
        <img src="${esc(it.product.image)}" class="w-24 h-32 object-cover rounded-lg" alt=""/>
        <div class="flex-1 flex flex-col">
          <span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary">${esc(it.product.designer)}</span>
          <h3 class="font-title-md text-title-md">${esc(it.product.name)}</h3>
          <span class="font-body-sm text-on-surface-variant">${S.money(it.product.price)} each</span>
          <div class="mt-auto flex items-center gap-3">
            <button class="qty w-8 h-8 rounded-full bg-surface-container hover:bg-surface-container-high" data-pid="${it.product.id}" data-d="-1">−</button>
            <span class="font-title-md">${it.qty}</span>
            <button class="qty w-8 h-8 rounded-full bg-surface-container hover:bg-surface-container-high" data-pid="${it.product.id}" data-d="1">+</button>
            <button class="remove ml-auto font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant hover:text-error" data-id="${it.id}">Remove</button>
          </div>
        </div>
        <span class="font-title-md text-title-md">${S.money(it.qty * it.product.price)}</span>
      </div>`).join('') : empty('Your bag is empty.');
    document.getElementById('sum-subtotal').textContent = S.money(cart.total);
    document.getElementById('sum-total').textContent = S.money(cart.total);
    document.getElementById('place-order').disabled = !cart.items.length;
    if (window.atelierReveal) window.atelierReveal(box.children);
  }

  document.getElementById('bag-items').addEventListener('click', async e => {
    const qty = e.target.closest('.qty'), rm = e.target.closest('.remove');
    if (qty) await S.api('/cart', { method: 'POST', body: { user: user.id, product_id: +qty.dataset.pid, qty: +qty.dataset.d } });
    if (rm) await S.api('/cart/' + rm.dataset.id, { method: 'DELETE' });
    if (qty || rm) loadBag();
  });

  document.getElementById('checkout-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('co-name').value.trim();
    const email = document.getElementById('co-email').value.trim();
    try {
      const order = await S.api('/orders', { method: 'POST', body: { user: user.id, name, email } });
      S.notify(`Order #${order.id} placed — ${S.money(order.total)}. Thank you, ${name.split(' ')[0]}!`);
      history.replaceState(null, '', '#orders');
      show('orders');
    } catch (err) { S.notify(err.message); }
  });

  async function loadWishlist() {
    const items = await S.api('/wishlist?user=' + encodeURIComponent(user.id));
    const grid = document.getElementById('wishlist-grid');
    grid.innerHTML = items.length ? items.map(w => S.productCard(w.product, true)).join('') : empty('No saved pieces yet.');
    if (window.atelierReveal) window.atelierReveal(grid.children);
  }
  document.addEventListener('atelier:wishlist', () => { if (!location.hash.includes('wishlist')) return; setTimeout(loadWishlist, 300); });

  async function loadOrders() {
    const orders = await S.api('/orders?user=' + encodeURIComponent(user.id));
    const list = document.getElementById('orders-list');
    list.innerHTML = orders.length ? orders.map(o => {
      const items = JSON.parse(o.items_json);
      return `<div class="bg-surface-container-lowest rounded-xl p-6 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div><span class="font-title-md">Order #${o.id}</span> <span class="font-body-sm text-on-surface-variant ml-2">${new Date(o.created_at + (o.created_at.endsWith('Z') ? '' : 'Z')).toLocaleString()}</span></div>
          <div class="flex items-center gap-3"><span class="px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm uppercase tracking-wider">${esc(o.status)}</span><span class="font-title-md">${S.money(o.total)}</span></div>
        </div>
        <div class="flex gap-3 flex-wrap">${items.map(i => `<div class="flex items-center gap-3 bg-surface-container-low rounded-lg p-2 pr-4"><img src="${esc(i.image)}" class="w-10 h-12 object-cover rounded" alt=""/><div><p class="font-body-sm font-semibold">${esc(i.name)}</p><p class="font-label-sm text-[10px] uppercase text-on-surface-variant">${esc(i.designer)} · Qty ${i.qty}</p></div></div>`).join('')}</div>
      </div>`;
    }).join('') : empty('You have not placed any orders yet.');
    if (window.atelierReveal) window.atelierReveal(list.children);
  }

  show(['bag', 'wishlist', 'orders'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'bag');
});
</script>
</body></html>
